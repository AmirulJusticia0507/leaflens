services:
  - type: web
    name: leaflens-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leaflens-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.6-27b
      - key: GROQ_REASONING_MODEL
        value: deepseek-r1-distill-llama-70b
      - key: CORS_ORIGINS
        value: "*"
      - key: STORAGE_DIR
        value: /tmp/uploads
    disk:
      name: uploads
      mountPath: /tmp/uploads
      sizeGB: 1

databases:
  - name: leaflens-db
    plan: free
    databaseName: leaflens
    user: leaflens
