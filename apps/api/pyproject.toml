[project]
name = "leaflens-api"
version = "0.1.0"
description = "LeafLens FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[tool.setuptools]
packages = ["app"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]

