<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — LeafLens</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #f8fafc 0%, #ecfdf5 100%);
      color: #0f172a;
      padding: 1.5rem;
    }
    @media (prefers-color-scheme: dark) {
      body { background: linear-gradient(160deg, #020617 0%, #064e3b 100%); color: #f8fafc; }
    }
    .card {
      max-width: 26rem;
      text-align: center;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(15, 23, 42, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      .card { background: rgba(15, 23, 42, 0.85); border-color: rgba(51, 65, 85, 0.5); }
    }
    .leaf { font-size: 3rem; line-height: 1; }
    h1 { font-size: 1.25rem; font-weight: 800; margin-top: 1rem; }
    p { margin-top: 0.75rem; font-size: 0.875rem; line-height: 1.6; opacity: 0.7; }
    button {
      margin-top: 1.5rem;
      border: none;
      cursor: pointer;
      padding: 0.7rem 1.5rem;
      border-radius: 0.75rem;
      font-weight: 700;
      font-size: 0.875rem;
      color: #fff;
      background: linear-gradient(to right, #059669, #0d9488);
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.35);
    }
    button:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <div class="card">
    <div class="leaf">🌿</div>
    <h1>Kamu Sedang Offline</h1>
    <p>LeafLens tidak dapat memuat halaman ini karena koneksi terputus. Riwayat scan terakhir tetap tersedia setelah halaman utama pernah dibuka.</p>
    <button onclick="location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
